<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #334155;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
    }
    .status {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 12px;
    }
    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      background: #065f46;
      color: #34d399;
      font-weight: 600;
      font-size: 10px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 12px;
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .info {
      font-size: 10px;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">⚡</span>
    <div class="title">Smart Productivity</div>
  </div>
  <div class="status">
    Tracking: <span class="status-badge" id="statusBadge">Active</span>
  </div>
  <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">API Token:</label>
  <input type="password" id="apiToken" placeholder="Paste your JWT token">
  <button id="saveBtn">Save Settings</button>
  <div class="info">
    Privacy-first telemetry: Tracks active focused time on supported sites (GitHub, LeetCode, GFG, freeCodeCamp, NPTEL) without reading private DOM contents.
  </div>
  <script src="popup.js"></script>
</body>
</html>
