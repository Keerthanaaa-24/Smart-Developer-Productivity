version: "3.9"

services:

  frontend:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  backend:
    build: ../backend
    ports:
      - "8001:8001"
    volumes:
      - ../backend:/app

  mysql:
    image: mysql:8
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_dashboard

    ports:
      - "3306:3306"
